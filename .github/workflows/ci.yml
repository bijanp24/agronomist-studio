name: CI

on:
  push:
    branches: [ main, feat/*, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Typecheck Shared Package
        run: npx tsc -p shared/tsconfig.json

      - name: Typecheck Angular Web App
        run: npx tsc --noEmit --project AgronomistStudio/tsconfig.json

      - name: Build Express Server
        run: npm run build --workspace=server

      - name: Run Express Server Integration Tests
        run: npm run test --workspace=server
